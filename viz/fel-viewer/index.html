<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyPhy FEL Interactive Explorer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F2F2EF;
      color: #1A1A18;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Dieter Rams Braun Industrial Header */
    .app-nav {
      height: 42px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #D1D1CB;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 11px;
      z-index: 100;
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #1A1A18;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .app-brand-badge {
      background-color: #1A1A18;
      color: #FFFFFF;
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }
    .app-brand-dot {
      color: #EB5E28;
      font-size: 12px;
    }
    .app-nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #767672;
      font-size: 11px;
    }
    .nav-sample-btn {
      background-color: #FFFFFF;
      border: 1px solid #D1D1CB;
      border-radius: 3px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 600;
      color: #1A1A18;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-sample-btn:hover {
      background-color: #1A1A18;
      color: #FFFFFF;
      border-color: #1A1A18;
    }
    .nav-sample-btn.active {
      background-color: #1A1A18;
      color: #FFFFFF;
      border-color: #1A1A18;
    }
    /* Viewer mount */
    #viewer-mount {
      flex: 1 1 0%;
      min-height: 0;
      display: flex;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }
    hyphy-fel-viewer {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Drag & Drop Overlay */
    #drop-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(242, 242, 239, 0.92);
      border: 2px dashed #EB5E28;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
      backdrop-filter: blur(2px);
    }
    #drop-overlay.active {
      display: flex;
    }
    .drop-box {
      background-color: #FFFFFF;
      border: 1px solid #D1D1CB;
      border-radius: 4px;
      padding: 36px 52px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .drop-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .drop-box h2 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #1A1A18;
      text-transform: uppercase;
    }
    .drop-box p {
      color: #767672;
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <nav class="app-nav">
      <div class="app-brand">
        <span class="app-brand-badge">HYPHY 3</span>
        <span>Selection Explorer</span>
        <span class="app-brand-dot">●</span>
      </div>
      <div class="app-nav-links">
        <span style="font-weight: 700; color: #1A1A18; text-transform: uppercase; font-size: 10px;">Samples:</span>
        <button class="nav-sample-btn active" data-url="/samples/cd2_meme.json">CD2 (MEME)</button>
        <button class="nav-sample-btn" data-url="/samples/bglobin.json">β-globin (FEL)</button>
        <button class="nav-sample-btn" data-url="/samples/hiv_rt.json">HIV-1 RT (FEL)</button>
        <button class="nav-sample-btn" data-url="/samples/cd2_fel.json">CD2 (FEL)</button>
        <span style="color: #D1D1CB;">|</span>
        <button class="nav-sample-btn" id="btn-theme-toggle">Theme</button>
      </div>
    </nav>
    <div id="viewer-mount">
      <hyphy-meme-viewer id="fel-viewer" theme="light"></hyphy-meme-viewer>
    </div>
  </div>

  <!-- Drag and drop overlay -->
  <div id="drop-overlay">
    <div class="drop-box">
      <div class="drop-icon">📂</div>
      <h2>Drop HyPhy JSON File (FEL or MEME)</h2>
      <p>Supports Modern v3.0 JSON and legacy Datamonkey JSON</p>
    </div>
  </div>

  <script type="module">
    import './src/index.js';

    const viewer = document.getElementById('fel-viewer');
    let currentTheme = 'light';

    function loadSample(url) {
      fetch(url)
        .then(res => res.json())
        .then(data => {
          viewer.load(data);
        })
        .catch(err => {
          console.warn('Failed to load sample ' + url + ':', err);
        });
    }

    // Auto-load cd2_meme.json on launch
    window.addEventListener('DOMContentLoaded', () => {
      loadSample('/samples/cd2_meme.json');
    });

    // Sample switcher buttons
    document.querySelectorAll('.nav-sample-btn[data-url]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-sample-btn[data-url]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadSample(btn.dataset.url);
      });
    });

    // Theme toggle
    document.getElementById('btn-theme-toggle').addEventListener('click', () => {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      viewer.setAttribute('theme', currentTheme);
    });

    // Global Drag & Drop Listener
    const overlay = document.getElementById('drop-overlay');
    let dragCounter = 0;

    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      overlay.classList.add('active');
    });

    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        overlay.classList.remove('active');
      }
    });

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      overlay.classList.remove('active');

      const file = e.dataTransfer?.files?.[0];
      if (file) {
        viewer.viewer?.loadFile(file);
      }
    });
  </script>
</body>
</html>
