<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyPhy FEL Interactive Explorer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F2F2EF;
      color: #1A1A18;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Dieter Rams Braun Industrial Header */
    .app-nav {
      height: 42px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #D1D1CB;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 11px;
      z-index: 100;
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #1A1A18;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .app-brand-badge {
      background-color: #1A1A18;
      color: #FFFFFF;
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }
    .app-brand-dot {
      color: #EB5E28;
      font-size: 12px;
    }
    .app-nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #767672;
      font-size: 11px;
    }
    .app-nav-links code {
      font-family: "SF Mono", Monaco, monospace;
      background-color: #EDEDE9;
      padding: 1px 4px;
      border-radius: 2px;
      border: 1px solid #D1D1CB;
      color: #1A1A18;
    }
    .app-nav-links a {
      color: #767672;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.15s;
    }
    .app-nav-links a:hover {
      color: #EB5E28;
    }
    /* Viewer mount */
    #viewer-mount {
      flex: 1 1 0%;
      min-height: 0;
      display: flex;
      position: relative;
    }
    hyphy-fel-viewer {
      width: 100%;
      height: 100%;
    }
    /* Drag & Drop Overlay */
    #drop-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(242, 242, 239, 0.92);
      border: 2px dashed #EB5E28;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
      backdrop-filter: blur(2px);
    }
    #drop-overlay.active {
      display: flex;
    }
    .drop-box {
      background-color: #FFFFFF;
      border: 1px solid #D1D1CB;
      border-radius: 4px;
      padding: 36px 52px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .drop-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .drop-box h2 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #1A1A18;
      text-transform: uppercase;
    }
    .drop-box p {
      color: #767672;
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <nav class="app-nav">
      <div class="app-brand">
        <span class="app-brand-badge">HYPHY 3</span>
        <span>FEL Result Explorer</span>
        <span class="app-brand-dot">●</span>
      </div>
      <div class="app-nav-links">
        <span>Drag &amp; drop any <code>.FEL.json</code> to load</span>
        <span>•</span>
        <a href="https://github.com/veg/hyphy" target="_blank" rel="noopener">HyPhy GitHub</a>
      </div>
    </nav>
    <div id="viewer-mount">
      <hyphy-fel-viewer id="fel-viewer" theme="light"></hyphy-fel-viewer>
    </div>
  </div>

  <!-- Drag and drop overlay -->
  <div id="drop-overlay">
    <div class="drop-box">
      <div class="drop-icon">📂</div>
      <h2>Drop HyPhy FEL JSON File</h2>
      <p>Supports Modern v3.0 JSON and legacy Datamonkey JSON</p>
    </div>
  </div>

  <script type="module">
    import './src/index.js';

    const viewer = document.getElementById('fel-viewer');

    // Auto-load bglobin.json on launch
    window.addEventListener('DOMContentLoaded', () => {
      fetch('/samples/bglobin.json')
        .then(res => res.json())
        .then(data => {
          viewer.load(data);
        })
        .catch(err => {
          console.warn('Auto-load bglobin.json failed:', err);
        });
    });

    // Global Drag & Drop Listener
    const overlay = document.getElementById('drop-overlay');
    let dragCounter = 0;

    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      overlay.classList.add('active');
    });

    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        overlay.classList.remove('active');
      }
    });

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      overlay.classList.remove('active');

      const file = e.dataTransfer?.files?.[0];
      if (file) {
        viewer.viewer?.loadFile(file);
      }
    });
  </script>
</body>
</html>
